<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Night Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <p class="eyebrow">🍿 MOVIE NIGHT PLANNER</p>

            <h1>
                Build Your Perfect
                <span>Movie Night</span>
            </h1>

            <p class="intro">
                Pick a movie, snack, and drink, then create your
                perfect movie-night plan!
            </p>
        </header>


        <section class="planner-card">

            <div class="form-area">

                <label for="movie">Choose a movie</label>

                <select id="movie">
                    <option value="The Phantom of the Opera">
                        The Phantom of the Opera
                    </option>

                    <option value="Avengers: Endgame">
                        Avengers: Endgame
                    </option>

                    <option value="The Notebook">
                        The Notebook
                    </option>
                </select>


                <label for="snack">Choose a snack</label>

                <select id="snack">
                    <option value="Popcorn">Popcorn</option>
                    <option value="Chocolate">Chocolate</option>
                    <option value="Nachos">Nachos</option>
                    <option value="Candy">Candy</option>
                </select>


                <label for="drink">Choose a drink</label>

                <select id="drink">
                    <option value="Soda">Soda</option>
                    <option value="Iced Tea">Iced Tea</option>
                    <option value="Lemonade">Lemonade</option>
                    <option value="Hot Chocolate">Hot Chocolate</option>
                </select>


                <label for="guests">
                    How many people are watching?
                </label>

                <input
                    type="number"
                    id="guests"
                    min="1"
                    value="1"
                >


                <button id="planButton">
                    Create My Movie Night ✨
                </button>

            </div>


            <div id="result" class="result">

                <div class="ticket">🎟️</div>

                <h2>Your Movie Night</h2>

                <p>
                    Make your selections and click the button
                    to create your plan!
                </p>

            </div>

        </section>


        <footer>
            <p>
                Made with JavaScript, snacks, and a little movie magic 🎬
            </p>
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
